name: build env (linux)

# Standalone build-env image for linux: gbe-env:linux-<date> + :linux-latest.
# Builds Dockerfile.env-linux (gbe-deps + compiled linux deps). No nested
# workflows — build-release just pulls gbe-env:linux-latest when it runs.
#
# Rebuild when premake5-deps.lua (how deps build) or Dockerfile.env-linux change.
# After a Dockerfile.deps version bump, rebuild gbe-deps first (build-deps-image),
# then trigger this so it compiles on top of the refreshed sources.

on:
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Optional suffix appended to the date tag'
        required: false
        default: ''
  push:
    branches: ["github-builder"]
    paths:
      - "Dockerfile.env-linux"
      - "premake5-deps.lua"
      - ".github/workflows/build-env-linux.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: |
          DATE=$(date -u +%Y%m%d)
          SUFFIX="${{ inputs.tag_suffix }}"
          TAG="linux-${DATE}"
          [ -n "$SUFFIX" ] && TAG="${TAG}-${SUFFIX}"
          IMAGE=ghcr.io/${{ github.repository_owner }}/gbe-env
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          {
            echo "date_tag=$IMAGE:$TAG"
            echo "latest_tag=$IMAGE:linux-latest"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.env-linux
          push: true
          tags: |
            ${{ steps.tags.outputs.date_tag }}
            ${{ steps.tags.outputs.latest_tag }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## gbe-env (linux) image built"
            echo ""
            echo "- \`${{ steps.tags.outputs.date_tag }}\`"
            echo "- \`${{ steps.tags.outputs.latest_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
