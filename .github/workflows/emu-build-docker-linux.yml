name: "Build emu (Linux, inside gbe-deps image)"

# Builds the linux emulator by running the job *inside* the prebuilt
# ghcr.io/<owner>/gbe-deps image. That image already carries the pinned
# third-party sources + toolchain (premake5, cmake, 7za) and the
# `seed-third-party` helper, so there is no Dockerfile to maintain here and no
# separate deps/seed jobs — one container does fetch + compile + build.
#
# Linux only: the image is ubuntu-based. Windows targets need MSVC/msbuild;
# the old windows workflows are kept under .github/workflows-reference/.

on:
  workflow_call:
    # reusable
  workflow_dispatch:
    # manual trigger
    inputs:
      deps_image:
        description: "Override the gbe-deps image ref to build inside."
        required: false
        default: ""

permissions:
  contents: "read"
  packages: "read"

env:
  THIRD_PARTY_BASE_DIR: "third-party"

jobs:
  build:
    name: "build (inside gbe-deps)"
    runs-on: "ubuntu-24.04"
    if: ${{ !cancelled() }}

    # Resolve the image: the dispatch override if given, else <owner>/gbe-deps:latest.
    container:
      image: "ghcr.io/${{ inputs.deps_image == '' && format('{0}/gbe-deps:latest', github.repository_owner) || inputs.deps_image }}"
      credentials:
        username: "${{ github.actor }}"
        password: "${{ secrets.GITHUB_TOKEN }}"

    steps:
      # clone branch (build scripts + premake lua live in the repo, not the image)
      - name: "Checkout branch"
        uses: actions/checkout@v6

      # copy the prefetched third-party tree out of the image into the repo
      - name: "Seed third-party from image"
        shell: "bash"
        run: seed-third-party "${{ github.workspace }}/${{ env.THIRD_PARTY_BASE_DIR }}"

      # extra system libs the linux build needs (32-bit + overlay headers).
      # running as root inside the container, so no sudo.
      - name: "Install required packages"
        shell: "bash"
        run: |
          dpkg --add-architecture i386
          apt-get update -y
          apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib \
            libglx-dev libgl-dev libx11-dev:i386
          rm -rf /var/lib/apt/lists/*

      # compile deps + build every target/config (build_linux_premake.sh does all)
      - name: "Build emulator"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          chmod +x ./${{ env.THIRD_PARTY_BASE_DIR }}/common/linux/premake/premake5
          # build_linux_premake.sh auto-picks ~70% of cores; its --j parser is
          # buggy (reads $2), so don't pass it. --deps compiles deps + emu.
          bash build_linux_premake.sh --deps

      - name: "Upload target package"
        uses: actions/upload-artifact@v7
        with:
          name: "emu-linux-docker-${{ github.sha }}"
          path: "build/linux"
          if-no-files-found: "error"
          compression-level: 9
          retention-days: 1
