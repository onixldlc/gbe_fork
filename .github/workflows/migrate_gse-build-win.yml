name: "Build migrate_gse script (Windows)"

on:
  workflow_call:
    # needed since it allows this to become a reusable workflow
  workflow_dispatch:
    # allows manual trigger

permissions:
  contents: "read"
  packages: "read"

env:
  ARTIFACT_NAME: "migrate_gse-win-${{ github.sha }}"
  SCRIPT_BASE_DIR: "tools/migrate_gse"
  PACKAGE_BASE_DIR: "tools/migrate_gse/bin/win"

  THIRD_PARTY_BASE_DIR: "third-party"

jobs:
  # Linux helper: pulls gbe-deps image, tars third-party, uploads as artifact.
  seed:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/seed-deps-artifact.yml

  build:
    needs: seed
    runs-on: "windows-2025-vs2026"

    steps:
      - name: "Set up Python 3.12"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # on Windows Git will auto change line ending to CRLF, not preferable
      - name: "Ensure LF line ending"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          git config --local core.autocrlf false
          git config --system core.autocrlf false
          git config --global core.autocrlf false

      - name: "Checkout branch"
        uses: actions/checkout@v6

      # Replaces the previous actions/checkout of third-party/build/win.
      - name: "Download seeded third-party artifact"
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.seed.outputs.artifact_name }}
          path: "${{ github.workspace }}"

      - name: "Extract third-party tarball"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          tar -xzf third-party.tar.gz
          del /q third-party.tar.gz

      # env
      - name: "Install env"
        shell: cmd
        working-directory: "${{ env.SCRIPT_BASE_DIR }}"
        run: recreate_venv_win.bat

      # build
      - name: "Rebuild"
        shell: cmd
        working-directory: "${{ env.SCRIPT_BASE_DIR }}"
        run: rebuild_win.bat

      # upload artifact
      - name: "Upload build package"
        uses: actions/upload-artifact@v7
        with:
          name: "${{ env.ARTIFACT_NAME }}"
          path: "${{ env.PACKAGE_BASE_DIR }}/"
          if-no-files-found: "error"
          compression-level: 9
          retention-days: 1
