name: "Emu third-party dependencies (Windows)"

on:
  workflow_call:
    # needed since it allows this to become a reusable workflow
  workflow_dispatch:
    # allows manual trigger

permissions:
  contents: "read"
  packages: "read"

env:
  PREMAKE_ACTION: "vs2026"
  DEPS_CACHE_KEY: "emu-deps-win"
  DEPS_CACHE_DIR: "build/deps/win"

  PACKAGE_BASE_DIR: "build/package/win"
  THIRD_PARTY_BASE_DIR: "third-party"

  # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
  MAX_PARALLEL_JOBS: 4

jobs:
  # Linux helper: pulls gbe-deps image, tars third-party, uploads as artifact.
  seed:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/seed-deps-artifact.yml

  deps-build:
    needs: seed
    runs-on: "windows-2025-vs2026"
    if: ${{ !cancelled() }}

    steps:
      # on Windows Git will auto change line ending to CRLF, not preferable
      - name: "Ensure LF line ending"
        shell: "cmd"
        working-directory: ${{ github.workspace }}
        run: |
          git config --local core.autocrlf false
          git config --system core.autocrlf false
          git config --global core.autocrlf false

      - name: "Lookup cache for deps"
        id: "emu-deps-cache-step"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}"
          lookup-only: true # don't restore cache if found

      # we need branch because it has build scripts
      - name: "Checkout branch"
        if: steps.emu-deps-cache-step.outputs.cache-hit != 'true'
        uses: actions/checkout@v6

      - name: "Download seeded third-party artifact"
        if: steps.emu-deps-cache-step.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.seed.outputs.artifact_name }}
          path: "${{ github.workspace }}"

      - name: "Extract third-party tarball"
        if: steps.emu-deps-cache-step.outputs.cache-hit != 'true'
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          tar -xzf third-party.tar.gz
          del /q third-party.tar.gz

      - name: "Build deps"
        if: steps.emu-deps-cache-step.outputs.cache-hit != 'true'
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          set "CMAKE_GENERATOR=Visual Studio 18 2026"
          "${{env.THIRD_PARTY_BASE_DIR}}\common\win\premake\premake5.exe" --file=premake5-deps.lua --64-build --32-build --all-ext --all-build --j=${{ env.MAX_PARALLEL_JOBS }} --verbose --clean --os=windows vs2026
