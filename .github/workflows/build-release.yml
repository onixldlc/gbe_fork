name: "Build release (all)"

# Build every target, then publish the artifacts to a GitHub Release — one run.
#
# The emu build pulls gbe-env:linux-latest (which ships PRECOMPILED deps), so it
# only compiles the emu — no ~40min dep build per run.
#
# Standalone: runs on push of downstream changes (emu source, build scripts).
# The deps/env image inputs are BLACKLISTED so changing them doesn't self-run
# this — they rebuild their images via build-deps-image / build-env-linux, and
# the next downstream push here picks up the refreshed gbe-env:linux-latest.
#
# Currently wired: linux. Windows builds get added as more build jobs + to the
# `release` job's `needs:` list later.

on:
  push:
    branches: ["github-builder"]
    paths-ignore:
      - "Dockerfile.deps"
      - "Dockerfile.env-linux"
      - "premake5-deps.lua"
      - ".github/workflows/build-deps-image.yml"
      - ".github/workflows/build-env-linux.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag override. Empty = auto YYYYMMDD (with -rN if taken)."
        required: false
        type: string
        default: ""
      draft:
        description: "Create the release as a draft."
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark the release as a prerelease."
        required: false
        type: boolean
        default: false

permissions:
  contents: "write"   # publish release
  packages: "read"    # pull the deps image (seed)
  actions: "read"

jobs:
  # -------- build linux (deps already compiled in the image) --------
  build-linux:
    name: "build (linux)"
    runs-on: "ubuntu-24.04"
    if: ${{ !cancelled() }}
    permissions:
      contents: "read"
      packages: "read"
    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v6

      - name: "Pull gbe-env:linux image: seed sources + precompiled deps"
        shell: "bash"
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/gbe-env:linux-latest"
          echo "using image: $IMAGE"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE"
          CID=$(docker create "$IMAGE")
          mkdir -p third-party build/deps/linux
          # sources + tools (premake/cmake/7za) and the COMPILED deps
          docker cp "$CID:/opt/gbe_deps/third-party/." third-party/
          docker cp "$CID:/opt/gbe_build/build/deps/linux/." build/deps/linux/
          docker rm "$CID" >/dev/null

      - name: "Install required packages"
        shell: "bash"
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-multilib g++-multilib \
            libglx-dev libgl-dev libx11-dev:i386

      - name: "Build emulator (reusing precompiled deps)"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          chmod +x ./third-party/common/linux/premake/premake5
          # no --deps: the deps are already compiled in build/deps/linux. The
          # script just generates project files and builds the release targets.
          bash build_linux_premake.sh

      - name: "Upload target package"
        uses: actions/upload-artifact@v7
        with:
          name: "gbe_linux"
          path: "build/linux/gmake"
          if-no-files-found: "error"
          compression-level: 9
          retention-days: 1

  # -------- release --------
  release:
    name: "publish release"
    needs: ["build-linux"]
    runs-on: "ubuntu-24.04"
    if: ${{ !cancelled() && needs['build-linux'].result == 'success' }}
    steps:
      - name: "Checkout (repo context for gh)"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Download all build artifacts from this run"
        uses: actions/download-artifact@v8
        with:
          path: "artifacts"

      - name: "Compute release tag"
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: "bash"
        run: |
          set -euo pipefail
          OVERRIDE="${{ inputs.tag }}"
          if [ -n "$OVERRIDE" ]; then
            TAG="$OVERRIDE"
          else
            DATE=$(date -u +%Y%m%d)
            TAG="$DATE"
            N=0
            while gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; do
              N=$((N + 1))
              [ "$N" -gt 99 ] && { echo "too many tag collisions on $DATE" >&2; exit 1; }
              TAG="${DATE}-r${N}"
            done
          fi
          echo "release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Repack each artifact directory into one archive so the release gets a
      # tidy set of files instead of thousands of loose binaries.
      - name: "Repack artifacts"
        id: pack
        shell: "bash"
        run: |
          set -euo pipefail
          mkdir -p release_files
          shopt -s nullglob
          count=0
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            ( cd "$dir" && zip -qr -9 "../../release_files/${name}.zip" . )
            count=$((count + 1))
          done
          echo "packed $count artifact(s)"
          if [ "$count" -eq 0 ]; then
            echo "no artifacts found to release" >&2
            exit 1
          fi
          ls -la release_files/
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: "Create release and attach files"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ steps.tag.outputs.tag }}"
          name: "${{ steps.tag.outputs.tag }}"
          files: "release_files/*"
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Summary"
        shell: "bash"
        run: |
          {
            echo "## Release \`${{ steps.tag.outputs.tag }}\` published"
            echo ""
            echo "- artifacts attached: ${{ steps.pack.outputs.count }}"
            echo ""
            echo '```'
            ls -la release_files/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
