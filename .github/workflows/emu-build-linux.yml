name: "Build emu (Linux)"

# Reusable linux build. Pulls the pinned third-party tree straight out of the
# gbe-deps docker image (linux runner can pull it directly — no seed artifact
# needed), then compiles deps + every target/config via build_linux_premake.sh.
# Uploads the result as artifact "emu-linux-<sha>".
#
# Kept as a single job (no nested reusable) so the call chain stays shallow:
# build-deps-image -> build-release -> emu-build-linux.

on:
  workflow_call:
    # reusable — called by build-release.yml
  workflow_dispatch:
    # manual trigger for standalone testing

permissions:
  contents: "read"
  packages: "read"

env:
  THIRD_PARTY_BASE_DIR: "third-party"

jobs:
  build:
    name: "build (linux)"
    runs-on: "ubuntu-24.04"
    if: ${{ !cancelled() }}

    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v6

      - name: "Seed third-party from gbe-deps image"
        shell: "bash"
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/gbe-deps:latest"
          echo "using image: $IMAGE"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE"
          CID=$(docker create "$IMAGE")
          mkdir -p "${{ env.THIRD_PARTY_BASE_DIR }}"
          docker cp "$CID:/opt/gbe_deps/third-party/." "${{ env.THIRD_PARTY_BASE_DIR }}/"
          docker rm "$CID" >/dev/null

      - name: "Install required packages"
        shell: "bash"
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-multilib g++-multilib \
            libglx-dev libgl-dev libx11-dev:i386

      - name: "Build emulator"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          chmod +x ./${{ env.THIRD_PARTY_BASE_DIR }}/common/linux/premake/premake5
          # --deps compiles third-party then builds every target/config.
          # auto-picks ~70% of cores; its --j parser is buggy so don't pass it.
          bash build_linux_premake.sh --deps

      - name: "Upload target package"
        uses: actions/upload-artifact@v7
        with:
          name: "emu-linux-${{ github.sha }}"
          path: "build/linux"
          if-no-files-found: "error"
          compression-level: 9
          retention-days: 1
